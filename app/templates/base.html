<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SHAViewer{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='css/components.css') }}">

  {% block styles %}{% endblock %}
</head>

<body>

  <main class="split">
    {% block panels %}{% endblock %}
  </main>

  {# Canvas поверх всей страницы. pointer-events: none — клики проходят сквозь #}
  <canvas id="fx"></canvas>

  <script src="{{ url_for('static', path='js/canvas.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
